<!DOCTYPE html>

<html>
<head>
    <title>Convertify | Exchange Rate Calculator</title>
    <link href="styles.css" rel="stylesheet">
    <link href="../images/arrows.png" rel="icon" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="wrapper">
        <header class="user-select">Convertify</header>
        <p  class="user-select" id="header-text">Welcome to Convertify, your go-to web application for converting various file formats 

        <div id="enter-amount">
            <h4 class="user-select" >Enter amount</h4>
            <input id="amount" placeholder="100">
        </div>

        <div id="conversion">

            <div class="From-To">
                <h4 class="user-select">From</h4>
                <input id="from">
                <ul id="from-suggestions"></ul>
            </div>

            <button id="switch"></button>

            <div class="From-To">
                <h4 class="user-select" >To</h4>
                <input id="to">
            </div>
            
        </div>

        <section>
            <p>     <br/>      </p>
        </section>

        <button id="exchange">Get Exchange Rate</button>
        
    </div>

    <script src="js/script.js" type="module"></script>
    <!-- <script src="js/country-list.js"></script> -->

</body>
</html>
